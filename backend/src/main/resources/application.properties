# NyayaSetu Spring Boot Configuration
spring.application.name=nyaysetu-backend
server.port=8080

# H2 Database in-memory setup for instant execution (MySQL compatible)
spring.datasource.url=jdbc:h2:mem:nyaysetudb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Groq API Configuration — set GROQ_API_KEY as an environment variable, never hardcode
groq.api.key=${GROQ_API_KEY:}
