# NyayaSetu Spring Boot Configuration
spring.application.name=nyaysetu-backend
server.port=8080

# Database Configuration (Aiven MySQL / Local MySQL via Environment Variables)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:nyayasetu}?useSSL=${DB_SSL:false}&requireSSL=${DB_SSL:false}&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USER:${DB_USERNAME:root}}
spring.datasource.password=${DB_PASSWORD:}

# JPA Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Flyway Database Migration Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Clerk JWT Resource Server Configuration
clerk.issuer=${CLERK_ISSUER:https://striking-kid-70.clerk.accounts.dev}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${CLERK_JWKS_URL:https://striking-kid-70.clerk.accounts.dev/.well-known/jwks.json}

# Bootstrap Admin Configuration
admin.email=${ADMIN_EMAIL:priyamsingh504@gmail.com}

# Groq AI Key Configuration
groq.api.key=${GROQ_API_KEY:}

# YouPI PG V2 Gateway Configuration
youpi.api.url=${YOUPI_PG_URL:http://localhost:6100}
youpi.checkout.portal.url=${YOUPI_PORTAL_URL:http://localhost:7000}
youpi.merchant.id=${YOUPI_MERCHANT_ID:00000000-0000-0000-0000-000000000001}
youpi.webhook.secret=${YOUPI_WEBHOOK_SECRET:}

# Method B: Central Platform / Admin Bank Account Receiving Configuration
platform.payment.routing.model=${PAYMENT_ROUTING_MODEL:CENTRAL_ADMIN}
platform.admin.upi.vpa=${PLATFORM_ADMIN_UPI_VPA:8873932040@ptsbi}
platform.admin.payee.name=${PLATFORM_ADMIN_PAYEE_NAME:NyayaSetu Legal}
platform.commission.rate=${PLATFORM_COMMISSION_RATE:0.10}

# Security: Error Handling & Information Disclosure Prevention
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false

# Security: CORS Allowed Origins Whitelist
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,https://nyaysetu.in}


